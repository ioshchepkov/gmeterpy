name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install ruff

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip -e ".[test]"

      - name: Test
        run: pytest

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tools
        run: python -m pip install build check-wheel-contents twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Smoke test installed package
        run: |
          python -c "import gmeterpy; print(gmeterpy.__version__)"
          gabl --help
          gphone --help
          loop --help
          scx2 --help
          vgfit --help
